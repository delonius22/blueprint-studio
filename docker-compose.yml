# One command, one .env (SPECS S1.1, S1.2): docker compose up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: blueprint
      POSTGRES_PASSWORD: blueprint
      POSTGRES_DB: blueprint
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprint -d blueprint"]
      interval: 2s
      timeout: 5s
      retries: 30

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: .env
        required: false  # the e2e override supplies its own settings
    # Lets a model server on the host be reached as host.docker.internal on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/agent/health')"]
      interval: 3s
      timeout: 5s
      retries: 40

  web:
    build: ./web
    # Only the agent's address: provider keys never reach the web container (S1.5).
    environment:
      AGENT_URL: ${AGENT_URL:-http://agent:8000}
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy

volumes:
  db-data:

[project]
name = "blueprint-agent"
version = "0.1.0"
description = "Blueprint Studio agent service: AG-UI endpoint, LangGraph graph and session API."
requires-python = ">=3.14,<3.15"
dependencies = [
    "langgraph==1.2.15",
    "openai==3.31.0",
    "copilotkit==0.1.96",
    "ag-ui-langgraph==0.0.47",
    "langgraph-checkpoint-postgres==3.1.3",
    "fastapi==0.143.1",
    "python-docx==1.2.0",
    "psycopg[binary,pool]>=3.2",
    "uvicorn[standard]>=0.30",
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiosqlite>=0.22",
    "pypdf==6.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]

# S12.1: app-assets/ stays at the repository root as the source. hatch_build.py
# copies it, byte for byte, into the package on every build (wheel or editable).
artifacts = ["src/blueprint/app_assets/*"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
# Rebuild (and so re-copy app-assets) whenever the sources or the assets change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "../app-assets/*" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:`get_config_jsonschema` is deprecated:DeprecationWarning:ag_ui_langgraph"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is the formatter's job; it leaves long string literals intact.
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ag_ui_langgraph.*", "ag_ui.*", "copilotkit.*"]
ignore_missing_imports = true
